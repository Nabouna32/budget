name: Generate backend lockfile

on:
  push:
    branches:
      - infra/7k-backend-lockfile

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Generate lockfile
        working-directory: backend
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit generated lockfile and remove bootstrap workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/package-lock.json
          rm .github/workflows/generate-backend-lock.yml
          git add .github/workflows/generate-backend-lock.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore(backend): generate package-lock"
          git push

# Trigger bootstrap after workflow creation.
